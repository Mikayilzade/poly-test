name: research-integrity

on:
  push:
    paths:
      - "research/**"
      - "tools/validate_research.py"
      - ".github/workflows/research-integrity.yml"
  pull_request:
    paths:
      - "research/**"
      - "tools/validate_research.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_research.py
